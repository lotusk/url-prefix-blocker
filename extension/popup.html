<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        margin: 12px;
        font: 13px system-ui, sans-serif;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 8px;
        color: #666;
      }
      textarea {
        width: 100%;
        height: 140px;
        box-sizing: border-box;
        font: 12px ui-monospace, monospace;
        padding: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        padding: 4px 14px;
      }
      #status {
        color: #1a7f37;
      }
    </style>
  </head>
  <body>
    <h1>Blocked prefixes</h1>
    <p>One per line, for example youtube.com/shorts</p>
    <textarea id="list" spellcheck="false"></textarea>
    <div class="row">
      <button id="save">Save</button>
      <span id="status"></span>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
