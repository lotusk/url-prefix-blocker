<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .shot {
        grid-template-columns: 400px 1fr;
      }
    </style>
  </head>
  <body class="shot">
    <div>
      <h1>Works inside the site too</h1>
      <p>Clicking a Short from the YouTube home page is blocked, not just typing the link.</p>
      <ul>
        <li>Normal videos still play</li>
        <li>The blocked page shows what was stopped</li>
      </ul>
    </div>
    <div class="stage">
      <div class="window">
        <div class="bar">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="address">youtube.com/shorts/abc123 &rarr; blocked</span>
        </div>
        <img src="../build/blocked.png" alt="" />
      </div>
    </div>
  </body>
</html>
